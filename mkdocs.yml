site_name: 나의 컨벤션 위키
site_url: https://rniman.github.io/convention/
repo_url: https://github.com/rniman/convention
repo_name: rniman/convention
edit_uri: blob/master/docs/
site_description: C++ 코딩과 Git 협업을 위한 개인 개발 컨벤션
site_dir: site
docs_dir: docs
extra_css:
  - stylesheets/navigation.css
hooks:
  - scripts/site_hooks.py
theme:
  name: material
  language: ko
  font: false
  palette:
    - scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 어두운 화면으로 전환
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: 밝은 화면으로 전환
  features:
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang:
        - ko
        - en
markdown_extensions:
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - 홈: index.md
  - 컨벤션 적용 기준: baseline.md
  - 코딩:
      - 코딩 소개: coding/index.md
      - C++:
          - C++ 전체 목차: coding/cpp/index.md
          - 명명: coding/cpp/naming.md
          - 초기화: coding/cpp/initialization.md
          - 포맷: coding/cpp/formatting.md
          - const: coding/cpp/const.md
          - 주석: coding/cpp/comments.md
          - 헤더·include: coding/cpp/headers.md
          - 함수 매개변수·반환: coding/cpp/functions.md
          - 소유권·수명: coding/cpp/ownership.md
      - HLSL 셰이더 규칙 (초안): coding/hlsl.md
  - Git·협업:
      - Git·협업 소개: git/index.md
      - 커밋 메시지: git/commit-messages.md
      - 브랜치 명명: git/branches.md
      - 원본과 생성물 관리 (초안): git/artifacts.md
  - 테스트·품질:
      - 테스트·품질 소개: quality/index.md
      - 변경 검증과 결과 기록 (초안): quality/verification.md
  - 문서화:
      - 문서화 소개: documentation/index.md
  - 프로젝트별 규칙:
      - 프로젝트별 소개: projects/index.md
      - RnimanEngine (참조 초안): projects/rniman-engine.md
